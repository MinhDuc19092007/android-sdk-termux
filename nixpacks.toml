[phases.setup]
nixPkgs = [
    "nodejs-18_x",
    "python3",
    "wget",
    "gnupg",
    "ca-certificates",
    "xvfb-run",
    "libxss",
    "libappindicator-gtk3",
    "fonts-liberation",
    "libasound2",
    "libnspr4",
    "libnss3",
    "libx11",
    "libxcomposite1",
    "libxcursor1",
    "libxdamage1",
    "libxi6",
    "libxtst6",
    "libxrandr2",
    "libgbm1",
    "libxcb",
    "libdrm",
    "libxkbcommon",
    "at-spi2-atk",
    "gtk3"
]

[phases.install]
cmds = [
    "apt-get update",
    "apt-get install -y wget gnupg",
    "wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | apt-key add -",
    "echo 'deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main' >> /etc/apt/sources.list.d/google.list",
    "apt-get update",
    "apt-get install -y google-chrome-stable xvfb",
    "npm install",
    "chmod +x setup.sh postinstall.sh",
    "./postinstall.sh"
]

[start]
cmd = "npm start"
